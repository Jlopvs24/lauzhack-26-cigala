  </radialGradient>
  <radialGradient id="lumi-weak-idle-shine" cx="33%" cy="27%" r="50%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".34" stop-color="#fff" stop-opacity=".85"/>
    <stop offset=".9" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>
<ellipse class="g-shadow" cx="100" cy="206" rx="51" ry="6.5" fill="#1F2B4D" opacity=".12"/>
<g class="g-float">
 <g class="g-pose" transform="translate(0 9) rotate(0 100 176) translate(100 176) scale(1.07 0.91) translate(-100 -176)">
  <circle class="g-halo" cx="100" cy="116" r="99" fill="url(#lumi-weak-idle-halo)"/>
  <g class="g-jelly">
   <circle cx="100" cy="116" r="60" fill="url(#lumi-weak-idle-body)"/>
   <circle cx="100" cy="116" r="60" fill="url(#lumi-weak-idle-shade)"/>
   <circle cx="100" cy="116" r="60" fill="url(#lumi-weak-idle-shine)"/>
   <g class="g-face" transform="translate(100 126) scale(1.3)">
