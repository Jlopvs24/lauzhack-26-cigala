<svg class="guide-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Lumi, your guide (weak, idle)">
<defs>
  <radialGradient id="lumi-weak-idle-halo">
    <stop offset="0" stop-color="hsla(28, 24%, 78%, 0.30250000000000005)"/>
    <stop offset=".42" stop-color="hsla(28, 24%, 76%, 0.099)"/>
    <stop offset=".68" stop-color="hsla(28, 14%, 76%, 0)"/>
  </radialGradient>
  <radialGradient id="lumi-weak-idle-body" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="hsla(28, 14%, 95%, 1)"/>
    <stop offset=".6" stop-color="hsla(28, 14%, 87%, 1)"/>
    <stop offset="1" stop-color="hsla(28, 11.200000000000001%, 73%, 1)"/>
  </radialGradient>
  <radialGradient id="lumi-weak-idle-shade" cx="36%" cy="30%" r="78%">
    <stop offset=".55" stop-color="hsla(28, 45%, 46%, 0)"/>
