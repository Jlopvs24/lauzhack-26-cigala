    <ellipse cx="23" cy="10" rx="7" ry="3.8" fill="#F6A5C0" opacity="0.12"/>
    <g class="g-eyes" transform="translate(0 1.5)"><g class="g-eye"><rect x="-15.25" y="-3.5" width="6.5" height="7" rx="3.25" fill="#1F2B4D"/><circle cx="-10.9" cy="-0.8999999999999999" r="1.35" fill="#fff"/></g><g class="g-eye"><rect x="8.75" y="-3.5" width="6.5" height="7" rx="3.25" fill="#1F2B4D"/><circle cx="13.1" cy="-0.8999999999999999" r="1.35" fill="#fff"/></g></g>
    <g transform="translate(0 13)"><path class="g-mouth" d="M-6,3 Q0,-2.5 6,3 Q0,0.8 -6,3 Z" fill="#1F2B4D" stroke="#1F2B4D" stroke-width="1.1" stroke-linejoin="round"/></g>
   </g>
  </g>
 </g>
 
</g>
