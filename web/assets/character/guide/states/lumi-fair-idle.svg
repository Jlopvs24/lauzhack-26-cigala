<svg class="guide-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Lumi, your guide (fair, idle)">
<defs>
  <radialGradient id="lumi-fair-idle-halo">
    <stop offset="0" stop-color="hsla(44, 82%, 78%, 0.44000000000000006)"/>
    <stop offset=".42" stop-color="hsla(44, 82%, 76%, 0.144)"/>
    <stop offset=".68" stop-color="hsla(44, 72%, 76%, 0)"/>
  </radialGradient>
  <radialGradient id="lumi-fair-idle-body" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="hsla(44, 72%, 95%, 1)"/>
    <stop offset=".6" stop-color="hsla(44, 72%, 87%, 1)"/>
    <stop offset="1" stop-color="hsla(44, 57.6%, 73%, 1)"/>
  </radialGradient>
  <radialGradient id="lumi-fair-idle-shade" cx="36%" cy="30%" r="78%">
    <stop offset=".55" stop-color="hsla(44, 45%, 46%, 0)"/>
    <stop offset="1" stop-color="hsla(44, 45%, 46%, 0.4)"/>
  </radialGradient>
  <radialGradient id="lumi-fair-idle-shine" cx="33%" cy="27%" r="50%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".34" stop-color="#fff" stop-opacity=".85"/>
    <stop offset=".9" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>
<ellipse class="g-shadow" cx="100" cy="206" rx="45" ry="6.5" fill="#1F2B4D" opacity=".12"/>
<g class="g-float">
 <g class="g-pose" transform="translate(0 3) rotate(0 100 176) translate(100 176) scale(1.02 0.97) translate(-100 -176)">
  <circle class="g-halo" cx="100" cy="116" r="99" fill="url(#lumi-fair-idle-halo)"/>
  <g class="g-jelly">
   <circle cx="100" cy="116" r="60" fill="url(#lumi-fair-idle-body)"/>
   <circle cx="100" cy="116" r="60" fill="url(#lumi-fair-idle-shade)"/>
   <circle cx="100" cy="116" r="60" fill="url(#lumi-fair-idle-shine)"/>
   <g class="g-face" transform="translate(100 126) scale(1.3)">
    <ellipse cx="-23" cy="10" rx="7" ry="3.8" fill="#F6A5C0" opacity="0.3"/>
    <ellipse cx="23" cy="10" rx="7" ry="3.8" fill="#F6A5C0" opacity="0.3"/>
    <g class="g-eyes" transform="translate(0 0)"><g class="g-eye"><rect x="-15.25" y="-4.75" width="6.5" height="9.5" rx="3.25" fill="#1F2B4D"/><circle cx="-10.9" cy="-2.15" r="1.35" fill="#fff"/></g><g class="g-eye"><rect x="8.75" y="-4.75" width="6.5" height="9.5" rx="3.25" fill="#1F2B4D"/><circle cx="13.1" cy="-2.15" r="1.35" fill="#fff"/></g></g>
    <g transform="translate(0 13)"><path class="g-mouth" d="M-5,0.6 Q0,2 5,0.6 Q0,1.2 -5,0.6 Z" fill="#1F2B4D" stroke="#1F2B4D" stroke-width="1.1" stroke-linejoin="round"/></g>
   </g>
  </g>
 </g>
 
</g>
</svg>
